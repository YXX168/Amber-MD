name: amber_md
description: Amber MD - A beautiful glassmorphism Markdown viewer.
publish_to: 'none'
version: 6.3.0+630

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.4+1
  file_picker: ^11.0.3
  google_fonts: ^8.2.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  path: ^1.9.0
  receive_intent: ^0.2.7
  url_launcher: ^6.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.svg
